name: Public source compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-ubuntu:
    name: Ubuntu full / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and prepare reference contracts
        shell: pwsh
        run: ./scripts/prepare-public-ci.ps1
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - name: Run complete Ubuntu profile
        shell: pwsh
        run: ./scripts/run-ci-profile.ps1 -Profile ubuntu-full -PythonExecutable '${{ steps.python.outputs.python-path }}'

  backend-windows:
    name: Windows smoke / Python 3.14
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and prepare reference contracts
        shell: pwsh
        run: ./scripts/prepare-public-ci.ps1
      # This is an ephemeral GitHub VM, never the user's shared Windows host.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - name: Run complete Windows profile
        shell: pwsh
        run: ./scripts/run-ci-profile.ps1 -Profile windows-smoke -PythonExecutable '${{ steps.python.outputs.python-path }}'

  frontend:
    name: Frontend full / Node 24 / pnpm 11
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and prepare reference contracts
        shell: pwsh
        run: ./scripts/prepare-public-ci.ps1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - name: Provision Chromium on the ephemeral hosted VM
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run complete frontend profile
        shell: pwsh
        run: ./scripts/run-ci-profile.ps1 -Profile frontend-full
      - name: Preserve failed frontend screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-failure
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: warn

  mysql-84:
    name: MySQL 8.4 compatibility / Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and prepare reference contracts
        shell: pwsh
        run: ./scripts/prepare-public-ci.ps1
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install --require-hashes -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - name: Run complete MySQL 8.4 profile
        id: mysql
        timeout-minutes: 110
        shell: pwsh
        run: ./scripts/run-ci-profile.ps1 -Profile mysql-compatibility -MySqlVersion 8.4 -PythonExecutable '${{ steps.python.outputs.python-path }}'
      - name: Clean this job's disposable MySQL container
        if: always()
        shell: pwsh
        env:
          MATRIX_CONTAINER: ${{ steps.mysql.outputs.mysql_container }}
          MATRIX_RUN_ID: ${{ steps.mysql.outputs.mysql_run_id }}
        run: ./scripts/cleanup-ci-mysql.ps1

  public-required:
    name: public-required
    if: always()
    needs: [backend-ubuntu, backend-windows, frontend, mysql-84]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every public profile
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          $failed = @($needs.GetEnumerator() | Where-Object { $_.Value.result -cne 'success' })
          if ($failed.Count -ne 0) {
            $failed | ForEach-Object { Write-Error "Required public profile failed: $($_.Key) ($($_.Value.result))" -ErrorAction Continue }
            exit 1
          }
