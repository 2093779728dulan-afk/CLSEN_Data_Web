map $http_x_request_id $request_id_for_upstream {
    default $http_x_request_id;
    "" $request_id;
}

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=60r/m;

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/tls-certificate.pem;
    ssl_certificate_key /etc/nginx/tls/tls-private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 100m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /edge-healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id_for_upstream;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id_for_upstream;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Request-ID $request_id_for_upstream;
    }
}
