name: clsen-data-web

x-app-environment: &app-environment
  APP_DEPLOYMENT_DATABASE: clsen_data
  APP_DEPLOYMENT_TEST_DATABASE: clsen_data_test_container
  APP_ENVIRONMENT: server
  APP_LOG_LEVEL: INFO
  APP_SESSION_COOKIE_SECURE: "true"
  APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_ORIGIN:-https://localhost:8443}
  APP_STORAGE_ROOT: /var/lib/clsen/raw
  APP_STORAGE_MAX_UPLOAD_BYTES: "104857600"
  APP_STORAGE_LEASE_TTL_SECONDS: "900"
  APP_STORAGE_LEASE_RENEW_INTERVAL_SECONDS: "300"
  APP_STORAGE_ORPHAN_AGE_SECONDS: "86400"
  APP_MAINTENANCE_WRITE_LOCK_TIMEOUT_SECONDS: "30"
  APP_MAINTENANCE_LOCK_WARNING_SECONDS: "120"
  APP_PRODUCT_ANALYTICS_SOURCE: ${APP_PRODUCT_ANALYTICS_SOURCE:?APP_PRODUCT_ANALYTICS_SOURCE is required}

x-app-hardening: &app-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  mysql:
    image: mysql:8.4.11
    command:
      - --authentication-policy=caching_sha2_password
      - --require-secure-transport=ON
      - --tls-version=TLSv1.2,TLSv1.3
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server-cert.pem
      - --ssl-key=/etc/mysql/tls/server-key.pem
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --transaction-isolation=READ-COMMITTED
      - --max-connections=100
      - --local-infile=OFF
      - --log-bin-trust-function-creators=ON
    environment:
      MYSQL_DATABASE: clsen_data
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_migrator_password
      - mysql_backup_password
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_tls:/etc/mysql/tls:ro
      - ./mysql/init-users.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    depends_on:
      mysql-tls-init:
        condition: service_completed_successfully
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysqladmin --protocol=TCP --host=127.0.0.1 --user=root --ssl-mode=VERIFY_CA --ssl-ca=/etc/mysql/tls/ca.pem ping --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  mysql-tls-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - install -o 999 -g 999 -m 0444 /run/secrets/mysql_ca_certificate /output/ca.pem && install -o 999 -g 999 -m 0444 /run/secrets/mysql_server_certificate /output/server-cert.pem && install -o 999 -g 999 -m 0400 /run/secrets/mysql_server_private_key /output/server-key.pem
    secrets:
      - mysql_ca_certificate
      - mysql_server_certificate
      - mysql_server_private_key
    volumes:
      - mysql_tls:/output
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  storage-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - chown -R 10001:10001 /raw /backups /restore /keyring
    volumes:
      - raw_data:/raw
      - backup_data:/backups
      - restore_data:/restore
      - backup_keyring:/keyring
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  migrate:
    profiles:
      - operations
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - migrate
    environment: *app-environment
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_migrator_password
      - mysql_backup_password
      - mysql_ca_certificate
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    <<: *app-hardening
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - api
    environment:
      <<: *app-environment
      APP_TRUSTED_PROXY: "*"
      APP_WEB_CONCURRENCY: "2"
    secrets:
      - mysql_app_password
      - session_secret
      - mysql_ca_certificate
    volumes:
      - raw_data:/var/lib/clsen/raw
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *app-hardening
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - worker
    environment: *app-environment
    secrets:
      - mysql_app_password
      - session_secret
      - mysql_ca_certificate
    volumes:
      - raw_data:/var/lib/clsen/raw
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import pathlib; raise SystemExit(0 if b'app.worker.cli' in pathlib.Path('/proc/1/cmdline').read_bytes() else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *app-hardening
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_PRODUCT_ANALYTICS_SOURCE: ${VITE_PRODUCT_ANALYTICS_SOURCE:?VITE_PRODUCT_ANALYTICS_SOURCE is required}
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *app-hardening
    restart: unless-stopped

  edge-tls-init:
    image: alpine:3.22
    command:
      - sh
      - -ec
      - install -o 101 -g 101 -m 0444 /run/secrets/tls_certificate /output/tls-certificate.pem && install -o 101 -g 101 -m 0400 /run/secrets/tls_private_key /output/tls-private-key.pem
    secrets:
      - tls_certificate
      - tls_private_key
    volumes:
      - edge_tls:/output
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  nginx:
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:8443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - edge_tls:/etc/nginx/tls:ro
    depends_on:
      edge-tls-init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --spider
        - https://127.0.0.1:8443/edge-healthz
      interval: 15s
      timeout: 5s
      retries: 5
    <<: *app-hardening
    restart: unless-stopped

  test-runner:
    profiles:
      - verification
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - pytest
      - --help
    environment:
      <<: *app-environment
      APP_ENVIRONMENT: test
      APP_SESSION_COOKIE_SECURE: "false"
      PYTEST_ADDOPTS: -p no:cacheprovider
    secrets:
      - mysql_app_password
      - mysql_migrator_password
      - mysql_backup_password
      - session_secret
      - mysql_ca_certificate
      - tls_certificate
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data
    volumes:
      - raw_data:/var/lib/clsen/raw
    <<: *app-hardening
    restart: "no"

  verification-backend:
    profiles:
      - load-test
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - api
    environment:
      <<: *app-environment
      APP_DEPLOYMENT_DATABASE: clsen_data_test_container
      APP_TRUSTED_PROXY: "*"
      APP_WEB_CONCURRENCY: "2"
    secrets:
      - mysql_app_password
      - session_secret
      - mysql_ca_certificate
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *app-hardening
    restart: "no"

  verification-nginx:
    profiles:
      - load-test
    image: nginxinc/nginx-unprivileged:1.29.8-alpine
    volumes:
      - ./nginx/verification.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
      - edge_tls:/etc/nginx/tls:ro
    depends_on:
      edge-tls-init:
        condition: service_completed_successfully
      verification-backend:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - --no-check-certificate
        - --quiet
        - --spider
        - https://127.0.0.1:9443/edge-healthz
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *app-hardening
    restart: "no"

  maintenance:
    profiles:
      - maintenance
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - maintenance
      - --help
    environment: *app-environment
    secrets:
      - mysql_backup_password
      - mysql_ca_certificate
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    volumes:
      - raw_data:/var/lib/clsen/raw:ro
      - backup_data:/var/lib/clsen/backups
      - restore_data:/var/lib/clsen/restore-tests
      - backup_keyring:/var/lib/clsen/keyring
    <<: *app-hardening
    restart: "no"

  restore-verifier:
    profiles:
      - maintenance
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command:
      - restore-verify
      - --help
    environment: *app-environment
    secrets:
      - mysql_root_password
      - mysql_backup_password
      - mysql_ca_certificate
    depends_on:
      mysql:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks:
      - data
    volumes:
      - raw_data:/var/lib/clsen/raw:ro
      - backup_data:/var/lib/clsen/backups:ro
      - restore_data:/var/lib/clsen/restore-tests
      - backup_keyring:/var/lib/clsen/keyring:ro
    <<: *app-hardening
    restart: "no"

networks:
  edge:
  data:
    internal: true

volumes:
  mysql_data:
  mysql_tls:
  raw_data:
  backup_data:
  restore_data:
  backup_keyring:
  edge_tls:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  mysql_migrator_password:
    file: ./secrets/mysql_migrator_password
  mysql_backup_password:
    file: ./secrets/mysql_backup_password
  session_secret:
    file: ./secrets/session_secret
  mysql_ca_certificate:
    file: ./secrets/mysql_ca_certificate.pem
  mysql_server_certificate:
    file: ./secrets/mysql_server_certificate.pem
  mysql_server_private_key:
    file: ./secrets/mysql_server_private_key.pem
  tls_certificate:
    file: ./secrets/tls_certificate.pem
  tls_private_key:
    file: ./secrets/tls_private_key.pem
