server.address=127.0.0.1
server.port=${PRODUCTION_PORT:23011}
spring.datasource.url=${PRODUCTION_DATABASE_URL}
spring.datasource.username=${PRODUCTION_DATABASE_USER}
spring.datasource.password=${PRODUCTION_DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
