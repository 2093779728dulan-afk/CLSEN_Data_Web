name: Application compatibility

on:
  push:
    branches: [master]
  pull_request:

permissions:
  actions: read
  contents: read

# A new group does not cancel already queued legacy profile runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('public-evidence-pr-{0}', github.event.pull_request.number) || format('public-evidence-master-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-evidence:
    name: Verify public CI source and complete jobs
    runs-on: [self-hosted, Linux, X64, clsen-rag-ov]
    timeout-minutes: 45
    steps:
      - name: Check out exact private source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify public source mapping and complete profiles
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: >-
          python3 scripts/verify_public_ci.py
          --source-sha "$SOURCE_SHA"
          --event "$SOURCE_EVENT"
          --wait-seconds 2400

  pr-required:
    name: pr-required
    if: always() && github.event_name == 'pull_request'
    needs: [public-evidence]
    runs-on: [self-hosted, Linux, X64, clsen-rag-ov]
    steps:
      - name: Require verified public evidence for PR
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          if ($needs.Count -ne 1 -or $needs['public-evidence'].result -cne 'success') {
            Write-Error 'Required public CI evidence is not successful.' -ErrorAction Continue
            exit 1
          }

  master-required:
    name: master-required
    if: always() && github.event_name == 'push'
    needs: [public-evidence]
    runs-on: [self-hosted, Linux, X64, clsen-rag-ov]
    steps:
      - name: Require verified public evidence for master
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          $needs = $env:NEEDS_JSON | ConvertFrom-Json -AsHashtable
          if ($needs.Count -ne 1 -or $needs['public-evidence'].result -cne 'success') {
            Write-Error 'Required public CI evidence is not successful.' -ErrorAction Continue
            exit 1
          }
